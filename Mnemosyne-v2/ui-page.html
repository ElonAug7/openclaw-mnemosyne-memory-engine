<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mnemosyne v2 · 小爪记忆系统</title>
<style>
:root{--bg:#0f1319;--card:#181f29;--card2:#1e2733;--fg:#e6e9ef;--dim:#8b95a5;--acc:#4da3ff;--ok:#3ecf8e;--warn:#f5a623;--err:#e06c5c;--line:#2a323e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px 24px;background:var(--card);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0}
header .sub{color:var(--dim);font-size:12px}
header .spacer{flex:1}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;cursor:pointer;user-select:none}
.badge.on{background:#16352a;color:var(--ok)}.badge.off{background:#3a2420;color:var(--err)}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px 24px;max-width:1400px;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:400px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.stat b{font-size:20px;display:block;color:var(--acc)}.stat span{color:var(--dim);font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
input[type=search]{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:13px;outline:none;min-width:120px}
input[type=search]:focus{border-color:var(--acc)}
.btn{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:#2a3442;border-color:#3a4552}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.warn{background:var(--warn);color:#111;border-color:var(--warn)}
.btn.small{padding:4px 10px;font-size:12px}
.filelist{max-height:62vh;overflow:auto}
.fileitem{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;word-break:break-all}
.fileitem:hover{background:#232b36}
.fileitem.active{background:#253347;color:var(--acc)}
.fileitem .meta{color:var(--dim);font-size:11px;white-space:nowrap;margin-left:8px}
.layer-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:6px;flex-shrink:0}
.layer-tag.工作台{background:#3a1e4a;color:#ce93d8}.layer-tag.今日摘要{background:#1e3a4a;color:#4fc3f7}
.layer-tag.对话记录{background:#2a2a3a;color:#90a4ae}.layer-tag.索引{background:#2d2a4a;color:#b39ddb}
.layer-tag.中期归档{background:#3a2e1e;color:#ffb74d}.layer-tag.长期知识{background:#1e3a2a;color:#81c784}
.layer-tag.系统{background:#333;color:#ff8a65}.layer-tag.回收站{background:#4a1e1e;color:#ef9a9a}
.layer-tag.待办{background:#2e3a1e;color:#ffd54f}
.layer-tag.其他{background:#333;color:#999}
.layer-filter{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.layer-btn{font-size:11px;padding:3px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--dim);cursor:pointer}
.layer-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.sys-toggle{font-size:10px;opacity:.6}
.sys-toggle.active{opacity:1}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px;background:#10151c;border-radius:8px;padding:14px;max-height:72vh;overflow:auto;border:1px solid var(--line);margin:0}
.mdview{background:#10151c;border-radius:8px;padding:16px 18px;max-height:72vh;overflow:auto;border:1px solid var(--line);font-size:14px}
.mdview h1,.mdview h2,.mdview h3{color:var(--acc);margin:18px 0 8px;line-height:1.3}
.mdview h1{font-size:20px;border-bottom:1px solid var(--line);padding-bottom:8px}.mdview h2{font-size:17px}.mdview h3{font-size:15px}
.mdview code{background:#222b38;padding:2px 6px;border-radius:4px;font-size:12px}
.mdview pre{border:none;padding:10px;background:#0d1117}
.mdview pre code{background:none;padding:0}
.mdview blockquote{border-left:3px solid var(--acc);margin:8px 0;padding:4px 12px;color:var(--dim);background:#141a23}
.mdview table{border-collapse:collapse;margin:10px 0;width:100%}
.mdview th,.mdview td{border:1px solid var(--line);padding:6px 10px;font-size:13px;text-align:left}
.mdview th{background:var(--card2)}
.mdview a{color:var(--acc)}
.mdview ul,.mdview ol{padding-left:24px}
.mdview hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.chat .msg{margin:10px 0;max-width:85%}
.chat .msg .who{font-size:11px;color:var(--dim);margin-bottom:3px}
.chat .msg .body{padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.chat .user{margin-right:auto}
.chat .user .body{background:#253347;border-top-left-radius:3px}
.chat .assistant{margin-left:auto}
.chat .assistant .body{background:#1c2a24;border-top-right-radius:3px}
.crumb{color:var(--dim);font-size:12px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--fg);padding:10px 20px;border-radius:10px;font-size:13px;z-index:99;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.err{border-color:var(--err);color:var(--err)}
.empty{color:var(--dim);text-align:center;padding:60px 0}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.filelist{max-height:36vh}}
</style>
</head>
<body>
<header>
  <img src="/api/logo" style="height:36px;vertical-align:middle;border-radius:6px" alt="小爪">
  <div>
    <h1>Mnemosyne <span style="font-size:11px;color:var(--dim)">v2 · 小爪记忆系统控制台</span></h1>
    <div class="sub">认知记忆引擎 · 本地化 · 可移植 · 零依赖</div>
  </div>
  <div class="spacer"></div>
  <span class="badge on" id="badge" title="点击切换开关">● 加载中</span>
</header>

<div class="wrap">
  <div class="panel">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <button class="btn acc" id="btn-signal">立即生成摘要</button>
      <button class="btn" id="btn-refresh">刷新</button>
      <button class="btn" id="btn-trash" onclick="showTrash()">回收站</button>
      <button class="btn" id="btn-suggest" onclick="showSuggestions()" style="color:var(--warn)">建议清理</button>
      <label style="font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px">
        <input type="checkbox" id="raw-record" checked onchange="toggleRawRecord()"> 保存对话记录
      </label>
      <label style="font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px">
        <input type="checkbox" id="auto-refresh" checked> 自动刷新
      </label>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="搜索文件名或路径…">
    </div>
    <div class="layer-filter" id="layer-filter"></div>
    <div class="filelist" id="files"></div>
  </div>

  <div class="panel">
    <div class="crumb" id="crumb"><span>← 从左侧选择文件查看</span></div>
    <div id="content"><div class="empty">点击左侧文件开始浏览<br><br>
      · .md 文件支持 Markdown 渲染<br>
      · .jsonl 原始对话流会显示为聊天气泡<br>
      · 随时可切换「原文」视图或下载</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
// ---- 全局错误兜底：任何 JS 报错都显示 toast，绝不白屏 ----
window.addEventListener("error", (e) => toast("页面错误: " + (e.message || e.type), true));
window.addEventListener("unhandledrejection", (e) => toast("请求失败: " + (e.reason && e.reason.message || e.reason || "未知"), true));

const $ = (id) => document.getElementById(id);
let cur = null, curRaw = "", viewMode = "preview", allFiles = [], layerFilter = null, showSystem = false;
const VISIBLE_LAYERS = ['工作台','今日摘要','对话记录','索引','中期归档','长期知识','待办','其他'];
const SYSTEM_LAYERS = ['__系统','__版本','__回收站'];
const ALL_LAYERS = [...VISIBLE_LAYERS, ...SYSTEM_LAYERS];

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.style.display = "block";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = "none"; }, 4000);
}

async function api(p) {
  const r = await fetch(p);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// ---------- 极简 Markdown 渲染（先转义再替换，防注入） ----------
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderMd(src) {
  const lines = esc(src).split("\n");
  let html = "", inCode = false, inList = false, table = [];
  const flushList = () => { if (inList) { html += "</ul>"; inList = false; } };
  const flushTable = () => {
    if (!table.length) return;
    let rows = table.filter(r => !/^\s*\|?[\s:-|]+\|?\s*$/.test(r));
    if (rows.length) {
      html += "<table>";
      rows.forEach((r, i) => {
        const cells = r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        html += "<tr>" + cells.map(c => (i === 0 ? "<th>" : "<td>") + inline(c) + (i === 0 ? "</th>" : "</td>")).join("") + "</tr>";
      });
      html += "</table>";
    }
    table = [];
  };
  const inline = (t) => t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const line of lines) {
    if (line.startsWith("```")) { flushList(); flushTable(); html += inCode ? "</code></pre>" : "<pre><code>"; inCode = !inCode; continue; }
    if (inCode) { html += line + "\n"; continue; }
    if (/^\|/.test(line.trim())) { flushList(); table.push(line); continue; }
    flushTable();
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { flushList(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (/^---+$/.test(line.trim())) { flushList(); html += "<hr>"; continue; }
    if (/^&gt;\s?/.test(line)) { flushList(); html += `<blockquote>${inline(line.replace(/^&gt;\s?/, ""))}</blockquote>`; continue; }
    if (/^[-*]\s+/.test(line.trim())) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(line.trim().replace(/^[-*]\s+/, ""))}</li>`; continue; }
    flushList();
    if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  flushList(); flushTable();
  if (inCode) html += "</code></pre>";
  return html;
}

// ---------- JSONL 对话气泡视图 ----------
function renderJsonl(src) {
  let html = '<div class="chat">';
  for (const line of src.split("\n")) {
    if (!line.trim()) continue;
    let o; try { o = JSON.parse(line); } catch { continue; }
    const cls = o.role === "user" ? "user" : "assistant";
    const name = o.role === "user" ? "Elon" : "小爪";
    const t = o.ts ? new Date(o.ts).toLocaleString("zh-CN") : "";
    html += `<div class="msg ${cls}"><div class="who">${name} · ${t}</div><div class="body">${esc(o.text || "")}</div></div>`;
  }
  return html + "</div>";
}

// ---------- 文件树 ----------
function renderLayerFilter() {
  const box = $("layer-filter");
  box.innerHTML = "";
  const mk = (label, val) => {
    const b = document.createElement("button");
    b.className = "layer-btn" + (layerFilter === val ? " active" : "");
    b.textContent = label;
    b.addEventListener("click", () => { layerFilter = val; renderLayerFilter(); renderFiles(); });
    box.appendChild(b);
  };
  mk("全部", null);
  for (const l of VISIBLE_LAYERS) { if (allFiles.some(f => f.layer === l)) mk(l, l); }
  const hasSys = allFiles.some(f => SYSTEM_LAYERS.includes(f.layer));
  if (hasSys) {
    const sep = document.createElement("span"); sep.textContent = "·"; sep.style.cssText = "color:var(--line);margin:0 4px";
    box.appendChild(sep);
    const btn = document.createElement("button");
    btn.textContent = "系统";
    btn.className = "layer-btn" + (showSystem ? " active" : "") + " sys-toggle";
    btn.addEventListener("click", () => { showSystem = !showSystem; renderLayerFilter(); renderFiles(); });
    box.appendChild(btn);
  }
}

function renderFiles() {
  const q = $("search").value.trim().toLowerCase();
  const box = $("files");
  box.innerHTML = "";
  const list = allFiles.filter(f =>
    (!q || f.path.toLowerCase().includes(q)) &&
    (!layerFilter || f.layer === layerFilter) &&
    (showSystem || !SYSTEM_LAYERS.includes(f.layer)));
  if (!list.length) { box.innerHTML = '<div class="empty">没有匹配的文件</div>'; return; }
  for (const f of list) {
    const d = document.createElement("div");
    d.className = "fileitem" + (f.path === cur ? " active" : "");
    const tag = document.createElement("span");
    tag.className = "layer-tag " + f.layer;
    tag.textContent = f.layer;
    const name = document.createElement("span");
    name.style.flex = "1";
    name.textContent = f.path;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = fmtSize(f.size);
    d.appendChild(tag); d.appendChild(name); d.appendChild(meta);
    const delBtn = document.createElement("button");
    delBtn.className = "btn small"; delBtn.textContent = "删除";
    delBtn.style.cssText = "padding:1px 6px;font-size:10px;opacity:0;transition:opacity .2s;flex-shrink:0";
    delBtn.title = "移入回收站";
    delBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteFile(f.path); });
    d.appendChild(delBtn);
    d.addEventListener("mouseenter", () => { delBtn.style.opacity = "1"; });
    d.addEventListener("mouseleave", () => { delBtn.style.opacity = "0"; });
    d.addEventListener("click", () => openFile(f.path));
    box.appendChild(d);
  }
}
function fmtSize(b) { return b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(1) + " MB"; }

async function deleteFile(p) {
  if (!confirm("确定将 " + p + " 移入回收站？\n15天后自动清除，期间可还原。")) return;
  try {
    const r = await fetch("/api/delete?p=" + encodeURIComponent(p)).then(r => r.json());
    if (r.trashed) {
      toast("已移入回收站");
      allFiles = await api("/api/files");
      if (cur === p) { cur = null; $("crumb").innerHTML = ""; $("view").innerHTML = "<div class=\'empty\'>已移入回收站</div>"; }
      renderFiles();
    } else {
      toast("失败: " + (r.error || ""), true);
    }
  } catch (e) { toast("失败: " + e.message, true); }
}


async function showSuggestions() {
  var modal = document.getElementById("suggest-modal");
  if (!modal) return;
  modal.style.display = "flex";
  try {
    var r = await fetch("/api/cleanup-suggestions").then(function(r){ return r.json(); });
    var list = document.getElementById("suggest-list");
    document.getElementById("suggest-count").textContent = r.total;
    document.getElementById("suggest-size").textContent = (r.freedEstimate/1024).toFixed(1) + " KB";
    if (!r.suggestions || !r.suggestions.length) { list.innerHTML = "<div class='empty'>没有需要清理的文件</div>"; return; }
    list.innerHTML = r.suggestions.map(function(i) {
      var icon = i.safe ? "安全" : "注意";
      return "<div style='display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)'>"
        + "<span style='font-size:13px'>" + icon + "</span>"
        + "<span style='flex:1;font-size:12px'>" + i.file + "</span>"
        + "<span style='color:var(--dim);font-size:11px'>" + fmtSize(i.size) + "</span>"
        + "<span style='color:var(--dim);font-size:11px'>" + i.age + "</span>"
        + "<span style='color:var(--warn);font-size:11px'>" + i.reason + "</span>"
        + (i.safe ? "<button class='btn small' style='color:var(--ok)' onclick='deleteSuggested(\"" + encodeURIComponent(i.file) + "\",this)'>删除</button>" : "")
        + "</div>";
    }).join("");
  } catch(e) { console.error(e); }
}
async function deleteSuggested(file, btn) {
  btn.textContent = "..."; btn.disabled = true;
  try {
    var r = await fetch("/api/delete?p=" + encodeURIComponent(decodeURIComponent(file))).then(function(r){ return r.json(); });
    if (r.trashed) { btn.textContent = "OK"; btn.style.color = "var(--ok)"; }
    else { btn.textContent = "ERR"; btn.style.color = "var(--err)"; toast("删除失败: " + (r.error||""), true); }
  } catch(e) { btn.textContent = "ERR"; btn.disabled = false; }
}
async function deleteAllSuggested() {
  if (!confirm("确定删除所有安全项？")) return;
  var r = await fetch("/api/cleanup-suggestions").then(function(r){ return r.json(); });
  if (!r.suggestions) return;
  var count = 0;
  for (var i of r.suggestions) {
    if (i.safe) {
      try { 
        var dr = await fetch("/api/delete?p=" + encodeURIComponent(i.file)).then(function(r){ return r.json(); });
        if (dr.trashed) count++;
      } catch(e) {}
    }
  }
  toast("已清理 " + count + " 项"); showSuggestions();
}

// ---------- 回收站 ----------
async function showTrash() {
  var modal = document.getElementById("trash-modal");
  if (!modal) return;
  modal.style.display = "flex";
  try {
    var r = await fetch("/api/trash").then(function(r){ return r.json(); });
    var list = document.getElementById("trash-list");
    if (!list) return;
    if (!r.items || !r.items.length) { list.innerHTML = "<div class=\'empty\'>回收站为空</div>"; return; }
    list.innerHTML = r.items.map(function(i) {
      var d = new Date(i.deletedAt).toLocaleString("zh-CN");
      return "<div style=\'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)\'>"
        + "<span style=\'flex:1;font-size:13px\'>" + (i.original||"?").split("/").pop() + "</span>"
        + "<span style=\'color:var(--dim);font-size:11px\'>" + d + "</span>"
        + "<span style=\'color:var(--dim);font-size:11px\'>" + fmtSize(i.size||0) + "</span>"
        + "<button class=\'btn small\' onclick=\'restoreFile(\"" + i.trashId + "\")\'>还原</button>"
        + "<button class=\'btn small\' style=\'color:var(--err)\' onclick=\'purgeFile(\"" + i.trashId + "\")\'>彻底删除</button>"
        + "</div>";
    }).join("");
  } catch(e) { console.error(e); }
}
async function restoreFile(id) {
  try {
    var r = await fetch("/api/trash/restore?id=" + id).then(function(r){ return r.json(); });
    if (r.restored) { toast("已还原"); showTrash(); allFiles = await api("/api/files"); renderFiles(); }
    else { toast("还原失败", true); }
  } catch(e) { toast("还原失败", true); }
}
async function purgeFile(id) {
  if (!confirm("确定彻底删除？此操作不可撤销！")) return;
  try {
    var r = await fetch("/api/trash/purge?id=" + id).then(function(r){ return r.json(); });
    if (r.purged) { toast("已彻底删除"); showTrash(); }
    else { toast("失败", true); }
  } catch(e) { toast("失败", true); }
}
function closeTrash() { var m = document.getElementById("trash-modal"); if (m) m.style.display = "none"; }

// ---------- 打开文件 ----------
async function openFile(p) {
  cur = p;
  try {
    const d = await api("/api/file?p=" + encodeURIComponent(p));
    curRaw = d.text;
    viewMode = p.endsWith(".md") ? "preview" : "raw";
    renderContent(p, d);
    renderFiles();
  } catch (e) { toast("打开失败: " + e.message, true); }
}

function renderContent(p, d) {
  const when = d && d.mtime ? new Date(d.mtime).toLocaleString("zh-CN") : "";
  $("crumb").innerHTML = "";
  const back = document.createElement("button");
  back.className = "btn small"; back.textContent = "← 返回";
  back.addEventListener("click", goBack);
  const dl = document.createElement("button");
  dl.className = "btn small"; dl.textContent = "⬇ 下载原文";
  dl.addEventListener("click", () => { location.href = "/api/download?p=" + encodeURIComponent(p); });
  const delBtn2 = document.createElement("button");
  delBtn2.className = "btn small"; delBtn2.textContent = "删除";
  delBtn2.style.color = "var(--err)";
  delBtn2.addEventListener("click", () => { deleteFile(p); });
  const info = document.createElement("span");
  info.textContent = p + (d ? " · " + fmtSize(d.size) + " · 修改于 " + when : "");
  $("crumb").appendChild(back);
  $("crumb").appendChild(dl);
  $("crumb").appendChild(delBtn2);
  if (p.endsWith(".md")) {
    const tog = document.createElement("button");
    tog.className = "btn small";
    tog.textContent = viewMode === "preview" ? "切换原文" : "切换渲染";
    tog.addEventListener("click", () => { viewMode = viewMode === "preview" ? "raw" : "preview"; renderContent(p, d); });
    $("crumb").appendChild(tog);
  }
  $("crumb").appendChild(info);

  const box = $("content");
  if (!d) { box.innerHTML = '<div class="empty">← 从左侧选择文件查看</div>'; return; }
  if (viewMode === "raw") {
    const pre = document.createElement("pre");
    pre.textContent = d.text;
    box.innerHTML = ""; box.appendChild(pre);
    return;
  }
  const div = document.createElement("div");
  if (p.endsWith(".jsonl")) { div.className = "mdview"; div.innerHTML = renderJsonl(d.text); }
  else if (p.endsWith(".md")) { div.className = "mdview"; div.innerHTML = renderMd(d.text); }
  else { const pre = document.createElement("pre"); pre.textContent = d.text; box.innerHTML = ""; box.appendChild(pre); return; }
  box.innerHTML = ""; box.appendChild(div);
}

function goBack() {
  cur = null; curRaw = "";
  $("crumb").innerHTML = '<span>← 从左侧选择文件查看</span>';
  $("content").innerHTML = '<div class="empty">点击左侧文件开始浏览</div>';
  renderFiles();
}

// ---------- 状态栏 ----------
async function loadStatus() {
  try {
    const st = await api("/api/status");
    if (st.error) throw new Error(st.error);
    $("badge").className = "badge " + (st.enabled ? "on" : "off");
    $("badge").textContent = st.enabled ? "● 自动记录：开启" : "● 自动记录：已暂停";
    // raw 对话记录开关
    const rawCb = $("raw-record");
    if (rawCb) rawCb.checked = st.recordRaw !== false;
    $("stats").innerHTML =
      '<span class="stat"><b>' + st.turns + '</b><span>累计轮次</span></span>' +
      '<span class="stat"><b>' + st.totalMessages + '</b><span>消息总数</span></span>' +
      '<span class="stat"><b>' + st.nextSignalIn + '</b><span>距下次摘要信号</span></span>' +
      (st.lastSignalAt ? '<span class="stat"><b>' + new Date(st.lastSignalAt).toLocaleTimeString("zh-CN") + '</b><span>上次信号</span></span>' : '');
  } catch (e) { toast("状态读取失败: " + e.message, true); }
}

async function loadFiles() {
  try {
    allFiles = await api("/api/files");
    renderLayerFilter();
    renderFiles();
    // 若当前打开的文件有更新，静默刷新内容
    if (cur) {
      const cur_ = cur;
      const d = await api("/api/file?p=" + encodeURIComponent(cur_));
      if (d.text !== curRaw) { curRaw = d.text; renderContent(cur_, d); }
    }
  } catch (e) { toast("文件列表失败: " + e.message, true); }
}

async function loadAll() { await Promise.all([loadStatus(), loadFiles()]); }

// ---------- 事件绑定 ----------
$("badge").addEventListener("click", async () => {
  const st = await api("/api/status");
  await api("/api/" + (st.enabled ? "disable" : "enable"));
  toast(st.enabled ? "已暂停自动记录" : "已恢复自动记录");
  loadAll();
});

async function toggleRawRecord() {
  const cb = $("raw-record"); if (!cb) return;
  const on = cb.checked;
  await api(on ? "/api/record-raw-on" : "/api/record-raw-off");
  toast(on ? "对话记录已开启" : "对话记录已关闭（其他功能正常）");
}

$("btn-signal").addEventListener("click", async () => {
  try { await api("/api/signal"); toast("摘要信号已发送，小爪会尽快生成摘要块"); }
  catch (e) { toast("发送失败: " + e.message, true); }
});
$("btn-refresh").addEventListener("click", () => { toast("已刷新"); loadAll(); });
$("search").addEventListener("input", renderFiles);
setInterval(() => { if ($("auto-refresh").checked) loadAll(); }, 15000);

loadAll();
</script>


<div id="suggest-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)this.style.display='none'">
<div style="background:var(--card);border-radius:12px;padding:20px;max-width:700px;width:90%;max-height:80vh;overflow:auto" onclick="event.stopPropagation()">
<h3 style="margin:0 0 4px">建议清理 <span style="font-size:12px;color:var(--dim)">（安全项可直接删除）</span></h3>
<div style="font-size:11px;color:var(--dim);margin-bottom:12px">共计 <b id="suggest-count">-</b> 项，可释放 <b id="suggest-size">-</b></div>
<div id="suggest-list" style="max-height:50vh;overflow:auto"></div>
<div style="margin-top:12px;display:flex;gap:8px">
<button class="btn" onclick="document.getElementById('suggest-modal').style.display='none'">关闭</button>
<button class="btn" style="color:var(--ok)" onclick="deleteAllSuggested()">全部安全删除</button>
</div></div></div>
<div id="trash-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeTrash()">
<div style="background:var(--card);border-radius:12px;padding:20px;max-width:700px;width:90%;max-height:80vh;overflow:auto" onclick="event.stopPropagation()">
<h3 style="margin:0 0 12px">回收站 <span style="font-size:12px;color:var(--dim)">（保留15天，到期自动清除）</span></h3>
<div id="trash-list" style="max-height:50vh;overflow:auto"></div>
<div style="margin-top:12px;display:flex;gap:8px">
<button class="btn" onclick="closeTrash()">关闭</button>
<button class="btn" style="color:var(--err)" onclick="if(confirm('确定清空回收站？所有文件将被永久删除！')){fetch('/api/trash').then(r=>r.json()).then(d=>{if(d.items)d.items.forEach(i=>fetch('/api/trash/purge?id='+i.trashId));toast('已清空');showTrash()})}">清空回收站</button>
</div></div></div>
</body>
